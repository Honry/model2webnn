<!doctype html>
<meta charset="utf-8">
<title>m2w LLM runtime</title>
<style>
  body { font: 15px/1.5 "Segoe UI", sans-serif; margin: 16px; max-width: 1100px }
  label { margin-right: 14px } input, select, textarea, button { font: inherit }
  input[type=text] { width: 28em } textarea { width: 100%; height: 5em }
  pre { background: #111; color: #ddd; padding: 10px; white-space: pre-wrap; min-height: 8em; max-height: 28em; overflow: auto }
  #answer { background: #f4f7ff; color: #112; min-height: 3em }
  .ok { color: #0a0; font-weight: 600 } .bad { color: #c00; font-weight: 600 }
  .row { margin: 8px 0 }
</style>
<h3>m2w package on WebNN <small id="status">idle</small></h3>
<div class="row">
  <label>package URL <input id="pkg" type="text" value="../packages/aion-2.3b/"></label>
  <label>device <select id="device"><option>npu</option><option>gpu</option><option>cpu</option></select></label>
  <label>max length <input id="maxLength" type="text" size="5" value=""></label>
  <label>chunk <input id="chunk" type="text" size="4" value=""></label>
  <label>blocks/graph <input id="bpg" type="text" size="3" value="1"></label>
</div>
<div class="row"><button id="load">Load</button> <button id="check" disabled>Check against verification.json</button> <button id="bench" disabled>Bench (2 x N tokens)</button> <button id="clear">Clear cache</button></div>
<div class="row"><textarea id="prompt">What is the capital of France?</textarea></div>
<div class="row"><button id="send" disabled>Send</button> <label>max new tokens <input id="maxNew" type="text" size="4" value="128"></label></div>
<pre id="answer"></pre>
<pre id="out"></pre>
<script type="module" src="m2wllm.js?v=2"></script>
