name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24   # the LLM runtime tests need Float16Array
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:lib
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e "python[hf,dev]"
      - run: python -m pytest python   # includes the committed tiny package: its sha256 checksums must be reproduced byte for byte on Linux
